name: Article Forge checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest ruff==0.15.14
      - name: Lint
        run: ruff check scripts tests
      - name: Check formatting
        run: ruff format --check scripts/collect_search_console.py scripts/collect_keyword_planner.py tests/test_readiness.py
      - name: Compile Python
        run: python -m compileall -q scripts tests
      - name: Run tests
        run: pytest -q
