<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="100%" height="100%" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M72 100h88" stroke="#a74837" stroke-width="12"/><text x="72" y="200" fill="#26312e" font-size="65" font-weight="700">Plan the reset, too.</text><text x="72" y="302" fill="#59645d" font-size="38" font-weight="400">A short shoot still needs a clear handoff</text><text x="72" y="354" fill="#59645d" font-size="38" font-weight="400">between clients.</text><rect x="72" y="458" width="1056" height="272" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="72" y="458" width="8" height="272" rx="4" fill="#a74837"/><text x="104" y="530" fill="#a74837" font-size="58" font-weight="700">Before the slot</text><text x="104" y="592" fill="#26312e" font-size="54" font-weight="400">Confirm client and time</text><text x="104" y="651" fill="#26312e" font-size="54" font-weight="400">Share arrival instructions</text><text x="104" y="710" fill="#26312e" font-size="54" font-weight="400">Check the session roster</text><rect x="72" y="758" width="1056" height="272" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="72" y="758" width="8" height="272" rx="4" fill="#a74837"/><text x="104" y="830" fill="#a74837" font-size="58" font-weight="700">During the slot</text><text x="104" y="892" fill="#26312e" font-size="54" font-weight="400">Photograph the agreed scope</text><text x="104" y="951" fill="#26312e" font-size="54" font-weight="400">Keep client files identified</text><text x="104" y="1010" fill="#26312e" font-size="54" font-weight="400">Explain the next step</text><rect x="72" y="1058" width="1056" height="272" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="72" y="1058" width="8" height="272" rx="4" fill="#a74837"/><text x="104" y="1130" fill="#a74837" font-size="58" font-weight="700">Between slots</text><text x="104" y="1192" fill="#26312e" font-size="54" font-weight="400">Reset the setup</text><text x="104" y="1251" fill="#26312e" font-size="54" font-weight="400">Check the next client</text><text x="104" y="1310" fill="#26312e" font-size="54" font-weight="400">Protect the transition buffer</text><text x="72" y="1502" fill="#59645d" font-size="40" font-weight="400">Suggested mini-session sequence; use your actual</text><text x="72" y="1544" fill="#59645d" font-size="40" font-weight="400">session timings.</text></g></svg>