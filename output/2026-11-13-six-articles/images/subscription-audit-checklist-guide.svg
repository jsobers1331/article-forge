<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="100%" height="100%" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M92 100h88" stroke="#17685d" stroke-width="12"/><text x="92" y="200" fill="#26312e" font-size="72" font-weight="700">Give every renewal a decision.</text><text x="92" y="302" fill="#59645d" font-size="36" font-weight="400">Review the records yourself, then track the action and</text><text x="92" y="354" fill="#59645d" font-size="36" font-weight="400">confirmation.</text><rect x="92.0" y="458" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="92.0" y="458" width="8" height="360" rx="4" fill="#17685d"/><text x="124.0" y="530" fill="#17685d" font-size="42" font-weight="700">Keep</text><text x="124.0" y="592" fill="#26312e" font-size="28" font-weight="400">Still useful?</text><text x="124.0" y="650" fill="#26312e" font-size="28" font-weight="400">Fits the household plan?</text><text x="124.0" y="708" fill="#26312e" font-size="28" font-weight="400">Record the next renewal</text><rect x="551.0" y="458" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="551.0" y="458" width="8" height="360" rx="4" fill="#17685d"/><text x="583.0" y="530" fill="#17685d" font-size="42" font-weight="700">Cancel</text><text x="583.0" y="592" fill="#26312e" font-size="28" font-weight="400">Check the vendor terms</text><text x="583.0" y="650" fill="#26312e" font-size="28" font-weight="400">Complete cancellation</text><text x="583.0" y="708" fill="#26312e" font-size="28" font-weight="400">Save the confirmation</text><rect x="1010.0" y="458" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="1010.0" y="458" width="8" height="360" rx="4" fill="#17685d"/><text x="1042.0" y="530" fill="#17685d" font-size="42" font-weight="700">Review</text><text x="1042.0" y="592" fill="#26312e" font-size="28" font-weight="400">Missing a detail?</text><text x="1042.0" y="650" fill="#26312e" font-size="28" font-weight="400">Name an action owner</text><text x="1042.0" y="708" fill="#26312e" font-size="28" font-weight="400">Set a decision date</text><text x="92" y="926" fill="#59645d" font-size="30" font-weight="400">Manual audit decision guide; cancellation happens with the vendor.</text></g></svg>