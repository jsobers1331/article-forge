<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="100%" height="100%" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M92 100h88" stroke="#a74837" stroke-width="12"/><text x="92" y="200" fill="#26312e" font-size="72" font-weight="700">Make delivery easy to follow.</text><text x="92" y="302" fill="#59645d" font-size="36" font-weight="400">Give the client a clear path from the message to their</text><text x="92" y="354" fill="#59645d" font-size="36" font-weight="400">photographs.</text><rect x="92.0" y="458" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="92.0" y="458" width="8" height="360" rx="4" fill="#a74837"/><text x="124.0" y="530" fill="#a74837" font-size="42" font-weight="700">Open the gallery</text><text x="124.0" y="592" fill="#26312e" font-size="28" font-weight="400">Use the correct private link</text><text x="124.0" y="650" fill="#26312e" font-size="28" font-weight="400">Explain access clearly</text><text x="124.0" y="708" fill="#26312e" font-size="28" font-weight="400">Verify the recipient</text><rect x="551.0" y="458" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="551.0" y="458" width="8" height="360" rx="4" fill="#a74837"/><text x="583.0" y="530" fill="#a74837" font-size="42" font-weight="700">Save or select</text><text x="583.0" y="592" fill="#26312e" font-size="28" font-weight="400">State included downloads</text><text x="583.0" y="650" fill="#26312e" font-size="28" font-weight="400">Explain selection requests</text><text x="583.0" y="708" fill="#26312e" font-size="28" font-weight="400">Use only agreed deadlines</text><rect x="1010.0" y="458" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="1010.0" y="458" width="8" height="360" rx="4" fill="#a74837"/><text x="1042.0" y="530" fill="#a74837" font-size="42" font-weight="700">Get help</text><text x="1042.0" y="592" fill="#26312e" font-size="28" font-weight="400">Give a reply route</text><text x="1042.0" y="650" fill="#26312e" font-size="28" font-weight="400">Ask what is not working</text><text x="1042.0" y="708" fill="#26312e" font-size="28" font-weight="400">Never request passwords</text><text x="92" y="926" fill="#59645d" font-size="30" font-weight="400">Delivery-email outline; not a screenshot or a product interface.</text></g></svg>