<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="100%" height="100%" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M72 100h88" stroke="#a74837" stroke-width="12"/><text x="72" y="200" fill="#26312e" font-size="65" font-weight="700">Make delivery easy to</text><text x="72" y="284" fill="#26312e" font-size="65" font-weight="700">follow.</text><text x="72" y="386" fill="#59645d" font-size="38" font-weight="400">Give the client a clear path from the message</text><text x="72" y="438" fill="#59645d" font-size="38" font-weight="400">to their photographs.</text><rect x="72" y="542" width="1056" height="272" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="72" y="542" width="8" height="272" rx="4" fill="#a74837"/><text x="104" y="614" fill="#a74837" font-size="58" font-weight="700">Open the gallery</text><text x="104" y="676" fill="#26312e" font-size="54" font-weight="400">Use the correct private link</text><text x="104" y="735" fill="#26312e" font-size="54" font-weight="400">Explain access clearly</text><text x="104" y="794" fill="#26312e" font-size="54" font-weight="400">Verify the recipient</text><rect x="72" y="842" width="1056" height="272" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="72" y="842" width="8" height="272" rx="4" fill="#a74837"/><text x="104" y="914" fill="#a74837" font-size="58" font-weight="700">Save or select</text><text x="104" y="976" fill="#26312e" font-size="54" font-weight="400">State included downloads</text><text x="104" y="1035" fill="#26312e" font-size="54" font-weight="400">Explain selection requests</text><text x="104" y="1094" fill="#26312e" font-size="54" font-weight="400">Use only agreed deadlines</text><rect x="72" y="1142" width="1056" height="272" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="72" y="1142" width="8" height="272" rx="4" fill="#a74837"/><text x="104" y="1214" fill="#a74837" font-size="58" font-weight="700">Get help</text><text x="104" y="1276" fill="#26312e" font-size="54" font-weight="400">Give a reply route</text><text x="104" y="1335" fill="#26312e" font-size="54" font-weight="400">Ask what is not working</text><text x="104" y="1394" fill="#26312e" font-size="54" font-weight="400">Never request passwords</text><text x="72" y="1502" fill="#59645d" font-size="40" font-weight="400">Delivery-email outline; not a screenshot or a</text><text x="72" y="1544" fill="#59645d" font-size="40" font-weight="400">product interface.</text></g></svg>