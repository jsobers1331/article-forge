<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M72 100h88" stroke="#17685d" stroke-width="12"/><text x="72" y="205" font-size="68" font-weight="700" fill="#26312e" text-anchor="start">Same bills. A different split.</text><text x="72" y="292" font-size="54" font-weight="700" fill="#17685d" text-anchor="start">Shared bills: 1,200</text><text x="72" y="370" font-size="40" font-weight="400" fill="#26312e" text-anchor="start">Hypothetical amounts in one currency.</text><text x="72" y="500" font-size="62" font-weight="700" fill="#26312e" text-anchor="start">Period A</text><text x="72" y="578" font-size="48" font-weight="400" fill="#26312e" text-anchor="start">Income: 2,400 + 1,600</text><rect x="72" y="628" width="1056" height="150" fill="#d7e4dd"/><rect x="72" y="628" width="633.6" height="150" fill="#17685d"/><text x="388.8" y="724" font-size="64" font-weight="700" fill="#fffdf8" text-anchor="middle">60%</text><text x="916.8000000000001" y="724" font-size="64" font-weight="700" fill="#17685d" text-anchor="middle">40%</text><text x="72" y="858" font-size="54" font-weight="700" fill="#26312e" text-anchor="start">Contributions: 720 / 480</text><text x="72" y="1000" font-size="62" font-weight="700" fill="#26312e" text-anchor="start">Period B</text><text x="72" y="1078" font-size="48" font-weight="400" fill="#26312e" text-anchor="start">Income: 1,800 + 1,800</text><rect x="72" y="1128" width="1056" height="150" fill="#d7e4dd"/><rect x="72" y="1128" width="528.0" height="150" fill="#17685d"/><text x="336.0" y="1224" font-size="64" font-weight="700" fill="#fffdf8" text-anchor="middle">50%</text><text x="864.0" y="1224" font-size="64" font-weight="700" fill="#17685d" text-anchor="middle">50%</text><text x="72" y="1358" font-size="54" font-weight="700" fill="#26312e" text-anchor="start">Contributions: 600 / 600</text><text x="72" y="1510" font-