<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="100%" height="100%" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M92 100h88" stroke="#17685d" stroke-width="12"/><text x="92" y="200" fill="#26312e" font-size="72" font-weight="700">Recalculate before bills are due.</text><text x="92" y="302" fill="#59645d" font-size="36" font-weight="400">Illustrative same-currency amounts, not a prediction or household</text><text x="92" y="354" fill="#59645d" font-size="36" font-weight="400">data.</text><rect x="92.0" y="458" width="663.5" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="92.0" y="458" width="8" height="360" rx="4" fill="#17685d"/><text x="124.0" y="530" fill="#17685d" font-size="42" font-weight="700">Period A</text><text x="124.0" y="592" fill="#26312e" font-size="40" font-weight="400">Income: 2,400 + 1,600</text><text x="124.0" y="650" fill="#26312e" font-size="40" font-weight="400">Shared bills: 1,200</text><text x="124.0" y="708" fill="#26312e" font-size="40" font-weight="400">Split: 60% / 40%</text><text x="124.0" y="766" fill="#26312e" font-size="40" font-weight="400">Contribute: 720 / 480</text><rect x="780.5" y="458" width="663.5" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="780.5" y="458" width="8" height="360" rx="4" fill="#17685d"/><text x="812.5" y="530" fill="#17685d" font-size="42" font-weight="700">Period B</text><text x="812.5" y="592" fill="#26312e" font-size="40" font-weight="400">Income: 1,800 + 1,800</text><text x="812.5" y="650" fill="#26312e" font-size="40" font-weight="400">Shared bills: 1,200</text><text x="812.5" y="708" fill="#26312e" font-size="40" font-weight="400">Split: 50% / 50%</text><text x="812.5" y="766" fill="#26312e" font-size="40" font-weight="400">Contribute: 600 / 600</text><text x="92" y="926" fill="#59645d" font-size="30" font-weight="400">Calculate percentages yourself; agree changes before