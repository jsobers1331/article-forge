<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M72 100h88" stroke="#17685d" stroke-width="12"/><text x="72" y="205" font-size="68" font-weight="700" fill="#26312e" text-anchor="start">Keep the plan and</text><text x="72" y="287" font-size="68" font-weight="700" fill="#26312e" text-anchor="start">payment separate.</text><text x="72" y="380" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">A CSV with headers only; you add the records.</text><rect x="72" y="485" width="1056" height="80" fill="#17685d"/><text x="97" y="541" font-size="44" font-weight="700" fill="#fffdf8" text-anchor="start">FIELD</text><text x="562" y="541" font-size="44" font-weight="700" fill="#fffdf8" text-anchor="start">RECORD</text><rect x="72" y="565" width="1056" height="80" fill="#fffdf8"/><text x="97" y="620" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Bill</text><text x="562" y="620" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">What is due</text><path d="M532 565v80" stroke="#c5cfc4" stroke-width="2"/><rect x="72" y="645" width="1056" height="80" fill="#e9eee6"/><text x="97" y="700" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Due date</text><text x="562" y="700" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">When it is due</text><path d="M532 645v80" stroke="#c5cfc4" stroke-width="2"/><rect x="72" y="725" width="1056" height="80" fill="#fffdf8"/><text x="97" y="780" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Expected amount</text><text x="562" y="780" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">Before it arrives</text><path d="M532 725v80" stroke="#c5cfc4" stroke-width="2"/><rect x="72" y="805" width="1056" height="80" fill="#e9eee6"/><text x="97" y="860" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Actual amount</text><text x="562" y="860" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">Final bill</text><path d="M532 805v80" stroke="#c5cfc4" stroke-width="2"/><rect x="72" y="885" width="1056" height="80" fill="#fffdf8"/><text x="97" y="940" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Currency</text><text x="562" y="940" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">Keep it visible</text><path d="M532 885v80" stroke="#c5cfc4" stroke-width="2"/><rect x="72" y="965" width="1056" height="80" fill="#e9eee6"/><text x="97" y="1020" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Payer</text><text x="562" y="1020" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">Who pays</text><path d="M532 965v80" stroke="#c5cfc4" stroke-width="2"/><rect x="72" y="1045" width="1056" height="80" fill="#fffdf8"/><text x="97" y="1100" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Status</text><text x="562" y="1100" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">Pending or paid</text><path d="M532 1045v80" stroke="#c5cfc4" stroke-width="2"/><rect x="72" y="1125" width="1056" height="80" fill="#e9eee6"/><text x="97" y="1180" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Paid date</text><text x="562" y="1180" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">After confirmation</text><path d="M532 1125v80" stroke="#c5cfc4" stroke-width="2"/><rect x="72" y="1205" width="1056" height="80" fill="#fffdf8"/><text x="97" y="1260" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Reference</text><text x="562" y="1260" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">Save proof</text><path d="M532 1205v80" stroke="#c5cfc4" stroke-width="2"/><rect x="72" y="1285" width="1056" height="80" fill="#e9eee6"/><text x="97" y="1340" font-size="43" font-weight="700" fill="#26312e" text-anchor="start">Shared split</text><text x="562" y="1340" font-size="43" font-weight="400" fill="#26312e" text-anchor="start">Record agreement</text><path d="M532 1285v80" stroke="#c5cfc4" stroke-width="2"/><text x="72" y="1490" font-size="40" font-weight="400" fill="#26312e" text-anchor="start">Due dates and expected amounts are plans.</text><text x="72" y="1550" font-size="40" font-weight="400" fill="#26312e" text-anchor="start">Paid status needs a payment confirmation.</text></g></svg>