<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600"><rect width="1200" height="1600" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M72 100h88" stroke="#17685d" stroke-width="12"/><text x="72" y="205" font-size="68" font-weight="700" fill="#26312e" text-anchor="start">Every renewal needs</text><text x="72" y="287" font-size="68" font-weight="700" fill="#26312e" text-anchor="start">a decision.</text><text x="72" y="380" font-size="44" font-weight="400" fill="#26312e" text-anchor="start">Check the terms in the vendor account.</text><circle cx="600" cy="650" r="200" fill="#fffdf8" stroke="#17685d" stroke-width="6"/><text x="600" y="630" font-size="58" font-weight="700" fill="#17685d" text-anchor="middle">Still a good</text><text x="600" y="705" font-size="68" font-weight="700" fill="#17685d" text-anchor="middle">fit?</text><path d="M600 850 V920 H240 V1020" fill="none" stroke="#17685d" stroke-width="5"/><rect x="130" y="948" width="220" height="60" fill="#f5f1e9"/><text x="240" y="990" font-size="44" font-weight="700" fill="#17685d" text-anchor="middle">YES</text><text x="240" y="1110" font-size="56" font-weight="700" fill="#17685d" text-anchor="middle">KEEP</text><text x="240" y="1200" font-size="43" font-weight="400" fill="#26312e" text-anchor="middle">Record the</text><text x="240" y="1265" font-size="43" font-weight="400" fill="#26312e" text-anchor="middle">next renewal</text><path d="M600 850 V920 H600 V1020" fill="none" stroke="#17685d" stroke-width="5"/><rect x="490" y="948" width="220" height="60" fill="#f5f1e9"/><text x="600" y="990" font-size="44" font-weight="700" fill="#17685d" text-anchor="middle">NO</text><text x="600" y="1110" font-size="56" font-weight="700" fill="#17685d" text-anchor="middle">CANCEL</text><text x="600" y="1200" font-size="43" font-weight="400" fill="#26312e" text-anchor="middle">Complete it</text><text x="600" y="1265" font-size="43" font-weight="400" fill="#26312e" text-anchor="middle">with the vendor</text><path d="M600 850 V920 H960 V1020" fill="none" stroke="#17685d" stroke-width="5"/><rect x="850" y="948" width="220" height="60" fill="#f5f1e9"/><text x="960" y="990" font-size="44" font-weight="700" fill="#17685d" text-anchor="middle">UNSURE</text><text x="960" y="1110" font-size="56" font-weight="700" fill="#17685d" text-anchor="middle">REVIEW</text><text x="960" y="1200" font-size="43" font-weight="400" fill="#26312e" text-anchor="middle">Name an owner</text><text x="960" y="1265" font-size="43" font-weight="400" fill="#26312e" text-anchor="middle">and review date</text><text x="72" y="1435" font-size="40" font-weight="400" fill="#26312e" text-anchor="start">Cancellation and refund requests are separate.</text><text x="72" y="1505" font-size="40" font-weight="400" fill="#26312e" text-anchor="start">Save the confirmation and access end date.</text></g></svg>