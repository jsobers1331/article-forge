<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="100%" height="100%" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M92 100h88" stroke="#a74837" stroke-width="12"/><text x="92" y="200" fill="#26312e" font-size="72" font-weight="700">Plan the reset, too.</text><text x="92" y="302" fill="#59645d" font-size="36" font-weight="400">A short shoot still needs a clear handoff between clients.</text><rect x="92.0" y="420" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="92.0" y="420" width="8" height="360" rx="4" fill="#a74837"/><text x="124.0" y="492" fill="#a74837" font-size="42" font-weight="700">Before the slot</text><text x="124.0" y="554" fill="#26312e" font-size="28" font-weight="400">Confirm client and time</text><text x="124.0" y="612" fill="#26312e" font-size="28" font-weight="400">Share arrival instructions</text><text x="124.0" y="670" fill="#26312e" font-size="28" font-weight="400">Check the session roster</text><rect x="551.0" y="420" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="551.0" y="420" width="8" height="360" rx="4" fill="#a74837"/><text x="583.0" y="492" fill="#a74837" font-size="42" font-weight="700">During the slot</text><text x="583.0" y="554" fill="#26312e" font-size="28" font-weight="400">Photograph the agreed scope</text><text x="583.0" y="612" fill="#26312e" font-size="28" font-weight="400">Keep client files identified</text><text x="583.0" y="670" fill="#26312e" font-size="28" font-weight="400">Explain the next step</text><rect x="1010.0" y="420" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="1010.0" y="420" width="8" height="360" rx="4" fill="#a74837"/><text x="1042.0" y="492" fill="#a74837" font-size="42" font-weight="700">Between slots</text><text x="1042.0" y="554" fill="#26312e" font-size="28" font-weight="400">Reset the setup</text><text x="1042.0" y="612" fill="#26312e" font-size="28" font-weight="400">Check the next client</text><text x="1042.0" y="670" fill="#26312e" font-size="28" font-weight="400">Protect the transition buffer</text><text x="92" y="926" fill="#59645d" font-size="30" font-weight="400">Suggested mini-session sequence; use your actual session timings.</text></g></svg>