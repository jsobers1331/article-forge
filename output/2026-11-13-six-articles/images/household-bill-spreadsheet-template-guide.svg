<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="100%" height="100%" fill="#f5f1e9"/><g font-family="Arial, sans-serif"><path d="M92 100h88" stroke="#17685d" stroke-width="12"/><text x="92" y="200" fill="#26312e" font-size="72" font-weight="700">Due is different from paid.</text><text x="92" y="302" fill="#59645d" font-size="36" font-weight="400">Use separate fields so a scheduled bill does not look settled.</text><rect x="92.0" y="420" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="92.0" y="420" width="8" height="360" rx="4" fill="#17685d"/><text x="124.0" y="492" fill="#17685d" font-size="42" font-weight="700">Plan</text><text x="124.0" y="554" fill="#26312e" font-size="28" font-weight="400">Bill and due date</text><text x="124.0" y="612" fill="#26312e" font-size="28" font-weight="400">Expected amount</text><text x="124.0" y="670" fill="#26312e" font-size="28" font-weight="400">Currency and payer</text><rect x="551.0" y="420" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="551.0" y="420" width="8" height="360" rx="4" fill="#17685d"/><text x="583.0" y="492" fill="#17685d" font-size="42" font-weight="700">Confirm</text><text x="583.0" y="554" fill="#26312e" font-size="28" font-weight="400">Actual amount</text><text x="583.0" y="612" fill="#26312e" font-size="28" font-weight="400">Pending or paid status</text><text x="583.0" y="670" fill="#26312e" font-size="28" font-weight="400">Actual paid date</text><rect x="1010.0" y="420" width="434.0" height="360" rx="16" fill="#fffdf8" stroke="#d5d9cf" stroke-width="2"/><rect x="1010.0" y="420" width="8" height="360" rx="4" fill="#17685d"/><text x="1042.0" y="492" fill="#17685d" font-size="42" font-weight="700">Keep the record</text><text x="1042.0" y="554" fill="#26312e" font-size="28" font-weight="400">Confirmation reference</text><text x="1042.0" y="612" fill="#26312e" font-size="28" font-weight="400">Shared-split note</text><text x="1042.0" y="670" fill="#26312e" font-size="28" font-weight="400">Next review</text><text x="92" y="926" fill="#59645d" font-size="30" font-weight="400">Column groups in the downloadable CSV; no built-in formulas or reminders.</text></g></svg>